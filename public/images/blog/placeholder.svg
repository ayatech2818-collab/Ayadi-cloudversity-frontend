      <stop offset="0" stop-color="#ecfdf5" />
      <stop offset="0.55" stop-color="#d1fae5" />
      <stop offset="1" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
